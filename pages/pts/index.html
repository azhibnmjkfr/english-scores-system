<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PTS Scores | ESS Dashboard</title>
  
  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
        /* Teacher's Command Center Theme */
        --primary: #234626; 
        --primary-dark: #1a351d;
        --accent: #D4AF37; 
        --bg-color: #F8FAFC;
        --text-main: #1E293B;
        --text-muted: #64748B;
        --white: #FFFFFF;
        
        --glass-bg: rgba(255, 255, 255, 0.95);
        --border-color: rgba(35, 70, 38, 0.1);
        --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
        font-family: 'Inter', sans-serif;
        background-color: var(--bg-color);
        color: var(--text-main);
        min-height: 100vh;
        padding-bottom: 2rem;
    }

    .bg-pattern {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1;
        background-image: radial-gradient(at 0% 0%, rgba(35, 70, 38, 0.05) 0px, transparent 50%),
                          radial-gradient(at 100% 0%, rgba(212, 175, 55, 0.1) 0px, transparent 50%);
    }

    /* --- Navigation --- */
    .nav-bar {
        max-width: 1200px;
        margin: 0 auto;
        padding: 1.5rem 1rem;
    }

    .back-btn {
        display: inline-flex; align-items: center; gap: 0.5rem;
        text-decoration: none; color: var(--primary);
        font-weight: 600; font-size: 0.9rem;
        padding: 0.5rem 1rem; background: white;
        border-radius: 50px; box-shadow: var(--shadow);
        border: 1px solid var(--border-color);
        transition: all 0.2s;
    }

    .back-btn:hover {
        transform: translateX(-3px);
        border-color: var(--accent);
        color: var(--accent);
    }

    /* --- Header --- */
    .page-header {
        text-align: center;
        margin-bottom: 2rem;
        padding: 0 1rem;
    }

    .page-header h1 {
        font-size: 2rem;
        font-weight: 700;
        color: var(--primary);
        margin-bottom: 0.5rem;
    }

    .page-header p {
        color: var(--text-muted);
        font-size: 0.95rem;
    }

    /* --- Stats Grid --- */
    .stats-container {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 1rem;
        max-width: 1200px;
        margin: 0 auto 2rem auto;
        padding: 0 1rem;
    }

    .stat-card {
        background: white;
        padding: 1.5rem;
        border-radius: 12px;
        box-shadow: var(--shadow);
        border: 1px solid var(--border-color);
        display: flex;
        align-items: center;
        gap: 1rem;
    }

    .stat-icon {
        width: 48px; height: 48px;
        background: rgba(35, 70, 38, 0.1);
        color: var(--primary);
        border-radius: 10px;
        display: flex; align-items: center; justify-content: center;
        font-size: 1.2rem;
    }

    .stat-info h3 { font-size: 1.5rem; font-weight: 700; color: var(--primary); line-height: 1; }
    .stat-info p { font-size: 0.8rem; color: var(--text-muted); margin-top: 0.25rem; }

    /* --- Filter Bar --- */
    .filter-bar {
        max-width: 1200px;
        margin: 0 auto 1.5rem auto;
        padding: 1rem;
        background: white;
        border-radius: 12px;
        box-shadow: var(--shadow);
        display: flex;
        gap: 1rem;
        flex-wrap: wrap;
        align-items: center;
    }

    .filter-select {
        padding: 0.6rem 1rem;
        border: 1px solid #e2e8f0;
        border-radius: 8px;
        color: var(--text-main);
        font-size: 0.9rem;
        min-width: 150px;
        outline: none;
    }

    .filter-select:focus { border-color: var(--accent); }

    .reset-btn {
        background: var(--primary);
        color: white;
        border: none;
        padding: 0.6rem 1.2rem;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 500;
        margin-left: auto;
    }

    /* --- Table --- */
    .table-wrapper {
        max-width: 1200px;
        margin: 0 auto;
        padding: 0 1rem;
    }

    .table-container {
        background: white;
        border-radius: 12px;
        box-shadow: var(--shadow);
        overflow-x: auto;
        border: 1px solid var(--border-color);
    }

    table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }

    thead {
        background: var(--primary);
        color: white;
        position: sticky; top: 0;
    }

    th { text-align: left; padding: 1rem; font-weight: 600; text-transform: uppercase; font-size: 0.8rem; letter-spacing: 0.5px; }
    td { padding: 1rem; border-bottom: 1px solid #f1f5f9; color: var(--text-main); }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background-color: #f8fafc; }

    /* Badges */
    .badge { padding: 0.25rem 0.6rem; border-radius: 4px; font-weight: 600; font-size: 0.8rem; }
    .badge-class { background: #e2e8f0; color: var(--text-main); }
    
    .score-high { background: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }
    .score-mid { background: #fef9c3; color: #854d0e; border: 1px solid #fde047; }
    .score-low { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }

    .status-badge { padding: 4px 10px; border-radius: 50px; font-size: 0.75rem; text-transform: uppercase; font-weight: 700; letter-spacing: 0.5px; }
    .status-lulus { background: #dcfce7; color: #15803d; }
    .status-remed { background: #ffedd5; color: #c2410c; }
    .status-gagal { background: #fee2e2; color: #b91c1c; }

    @media (max-width: 768px) {
        .filter-bar { flex-direction: column; align-items: stretch; }
        .reset-btn { margin-left: 0; }
    }
  </style>
</head>
<body>

  <div class="bg-pattern"></div>

  <div class="nav-bar">
    <a href="../../index.html" class="back-btn">
      <i class="fas fa-arrow-left"></i> Back to ESS Dashboard
    </a>
  </div>

  <div class="page-header">
    <h1>PTS Scores</h1>
    <p>Penilaian Tengah Semester • MTsT Daarut Tahfizh Al-Ikhlas</p>
  </div>

  <!-- Stats -->
  <div class="stats-container">
    <div class="stat-card">
        <div class="stat-icon"><i class="fas fa-users"></i></div>
        <div class="stat-info">
            <h3 id="totalStudents">-</h3>
            <p>Total Students</p>
        </div>
    </div>
    <div class="stat-card">
        <div class="stat-icon"><i class="fas fa-chart-line"></i></div>
        <div class="stat-info">
            <h3 id="averageScore">-</h3>
            <p>Average Score</p>
        </div>
    </div>
    <div class="stat-card">
        <div class="stat-icon"><i class="fas fa-trophy"></i></div>
        <div class="stat-info">
            <h3 id="highestScore">-</h3>
            <p>Highest Score</p>
        </div>
    </div>
  </div>

  <!-- Filters -->
  <div class="filter-bar">
    <select id="filterClass" class="filter-select">
      <option value="">All Classes</option>
    </select>
    <select id="filterRemedial" class="filter-select">
      <option value="">All Status</option>
      <option value="remedial">Remedial Needed</option>
      <option value="non-remedial">Passed</option>
    </select>
    <select id="filterSort" class="filter-select">
      <option value="">Sort by Final Score</option>
      <option value="desc">Highest First</option>
      <option value="asc">Lowest First</option>
    </select>
    <button id="resetFilters" class="reset-btn">Reset Filters</button>
  </div>

  <!-- Table -->
  <div class="table-wrapper">
    <div class="table-container">
      <table id="nilaiTable">
        <thead>
          <tr>
            <th>Student ID</th>
            <th>Name</th>
            <th>Class</th>
            <th>PTS Score</th>
            <th>Remedial</th>
            <th>Final Score</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <tr><td colspan="7" style="text-align:center; padding: 2rem;">Loading data from Google Sheets...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <div style="text-align: center; margin-top: 2rem; color: var(--text-muted); font-size: 0.8rem;">
    Last Update: <span id="lastUpdate">-</span>
  </div>

  <!-- Logic Preserved from Old File -->
  <script>
    const SHEET_URL = "https://docs.google.com/spreadsheets/d/1N-docAeezSqzkQcTk8mcPm-qMf-EisMELs_N35zAaT8/gviz/tq?tqx=out:csv&sheet=%F0%9F%93%8A%20pts_scores";
    const filterClass = document.getElementById("filterClass");
    const filterRemedial = document.getElementById("filterRemedial");
    const filterSort = document.getElementById("filterSort");
    const resetBtn = document.getElementById("resetFilters");
    const tableBody = document.getElementById("tableBody");
    const totalStudents = document.getElementById("totalStudents");
    const averageScore = document.getElementById("averageScore");
    const highestScore = document.getElementById("highestScore");
    const lastUpdate = document.getElementById("lastUpdate");
    let allData = [];

    function parseCSV(csvText){
      const rows=[];let currentRow=[];let inQuotes=false;let currentValue="";
      for(let i=0;i<csvText.length;i++){
        const char=csvText[i], nextChar=csvText[i+1];
        if(char==='"'){inQuotes=!inQuotes}
        else if(char===',' && !inQuotes){currentRow.push(currentValue.trim()); currentValue=""}
        else if(char=== '\n' && !inQuotes){currentRow.push(currentValue.trim()); rows.push(currentRow); currentRow=[]; currentValue=""}
        else if(char=== '\r' && nextChar=== '\n' && !inQuotes){currentRow.push(currentValue.trim()); rows.push(currentRow); currentRow=[]; currentValue=""; i++}
        else{currentValue+=char}
      }
      if(currentValue.trim()!=="" || currentRow.length>0){currentRow.push(currentValue.trim()); rows.push(currentRow)}
      return rows;
    }

    async function loadData(){
      try{
        const res=await fetch(SHEET_URL);
        if(!res.ok) throw new Error(`HTTP error! Status: ${res.status}`);
        const csv=await res.text();
        const rows=parseCSV(csv);
        if(rows.length<2) throw new Error("No data rows found");

        allData = rows.slice(1)
          .filter(r=>r.length>=7 && r[0] && r[0].trim()!=="")
          .map(row=>({
            studentCode:row[0].replace(/^"|"$/g,""),
            studentName:row[1].replace(/^"|"$/g,""),
            class:row[2].replace(/^"|"$/g,""),
            ptsScore:row[3].replace(/^"|"$/g,""),
            remedial:row[4].replace(/^"|"$/g,""),
            finalScore:row[5].replace(/^"|"$/g,""),
            notes:row[6].replace(/^"|"$/g,"")
          }));

        renderTable(allData);
        fillDropdowns(allData);
        updateStatistics(allData);
        updateLastUpdate();
      }catch(e){
        console.error("Error loading data:", e);
        tableBody.innerHTML = `<tr><td colspan="7" style="text-align:center; color:red;">Failed to load data.</td></tr>`;
      }
    }

    function getScoreBadge(score){
      const n=parseFloat(score); if(isNaN(n)) return "";
      if(n>=80) return "score-high";
      if(n>=75) return "score-mid";
      return "score-low";
    }

    function getStatusBadge(notes){
      const n=(notes||"").toLowerCase();
      if(n.includes("lulus")) return "<span class='status-badge status-lulus'>Passed</span>";
      if(n.includes("remedial")) return "<span class='status-badge status-remed'>Remedial</span>";
      if(n.includes("tidak")) return "<span class='status-badge status-gagal'>Failed</span>";
      return `<span class='status-badge' style='background:#f1f5f9; color:#64748b;'>${notes}</span>`;
    }

    function renderTable(data){
      tableBody.innerHTML="";
      if(data.length===0){
        tableBody.innerHTML=`<tr><td colspan="7" style="text-align:center;">No data matches filters.</td></tr>`;
        return;
      }
      data.forEach(item=>{
        const tr=document.createElement("tr");
        tr.innerHTML = `
          <td style="font-family:monospace; color:var(--text-muted);">${item.studentCode}</td>
          <td style="font-weight:500;">${item.studentName}</td>
          <td><span class="badge badge-class">${item.class}</span></td>
          <td><span class="badge ${getScoreBadge(item.ptsScore)}">${item.ptsScore}</span></td>
          <td><span class="badge ${getScoreBadge(item.remedial)}">${item.remedial}</span></td>
          <td><span class="badge ${getScoreBadge(item.finalScore)}" style="font-size:0.9rem;">${item.finalScore}</span></td>
          <td>${getStatusBadge(item.notes)}</td>
        `;
        tableBody.appendChild(tr);
      });
    }

    function fillDropdowns(data){
      const set=new Set(data.map(x=>x.class).filter(Boolean));
      filterClass.innerHTML='<option value="">All Classes</option>';
      Array.from(set).sort().forEach(c=>{
        const opt=document.createElement("option");
        opt.value=c; opt.textContent=c;
        filterClass.appendChild(opt);
      });
    }

    function updateStatistics(data){
      const scores = data.map(x=>parseFloat(x.finalScore)).filter(v=>!isNaN(v) && v>0);
      totalStudents.textContent = data.length;
      averageScore.textContent = scores.length ? (scores.reduce((a,b)=>a+b,0)/scores.length).toFixed(1) : '0.0';
      highestScore.textContent = scores.length ? Math.max(...scores).toFixed(1) : '0.0';
    }

    function updateLastUpdate(){
      const now=new Date();
      lastUpdate.textContent = now.toLocaleString('id-ID',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
    }

    function filterTable(){
      let filtered=[...allData];

      // Kelas
      const c=(filterClass.value||"").toLowerCase();
      if(c){ filtered=filtered.filter(x=>(x.class||"").toLowerCase()===c) }

      // Remedial
      const r=(filterRemedial.value||"").toLowerCase();
      if(r==="remedial"){
        filtered=filtered.filter(x=> (x.remedial && x.remedial!=='-') || (x.notes||"").toLowerCase().includes("remedial"));
      }else if(r==="non-remedial"){
        filtered=filtered.filter(x=> (!x.remedial || x.remedial==='-') && !((x.notes||"").toLowerCase().includes("remedial")));
      }

      // Sort Final Score
      const s=filterSort.value;
      if(s){
        filtered.sort((a,b)=>{
          const A=parseFloat(a.finalScore)||0, B=parseFloat(b.finalScore)||0;
          return s==="desc" ? B-A : A-B;
        });
      }

      renderTable(filtered);
      updateStatistics(filtered);
    }

    filterClass.addEventListener("change", filterTable);
    filterRemedial.addEventListener("change", filterTable);
    filterSort.addEventListener("change", filterTable);
    resetBtn.addEventListener("click", ()=>{
      filterClass.value=""; filterRemedial.value=""; filterSort.value="";
      renderTable(allData); updateStatistics(allData);
    });

    loadData();
  </script>
</body>
</html>
