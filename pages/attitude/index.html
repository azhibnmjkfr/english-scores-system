<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Attitude Scores | ESS Dashboard</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
        --primary: #234626; 
        --accent: #D4AF37; 
        --bg-color: #F8FAFC;
        --text-main: #1E293B;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: var(--bg-color); color: var(--text-main); }
    
    .bg-pattern { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; background-image: radial-gradient(at 0% 0%, rgba(35, 70, 38, 0.05) 0px, transparent 50%), radial-gradient(at 100% 0%, rgba(212, 175, 55, 0.1) 0px, transparent 50%); }

    /* Nav */
    .nav-bar { max-width: 1200px; margin: 0 auto; padding: 1.5rem 1rem; }
    .back-btn { display: inline-flex; align-items: center; gap: 0.5rem; text-decoration: none; color: var(--primary); font-weight: 600; padding: 0.5rem 1rem; background: white; border-radius: 50px; border: 1px solid rgba(35, 70, 38, 0.1); }
    
    .page-header { text-align: center; margin-bottom: 2rem; }
    .page-header h1 { font-size: 2rem; color: var(--primary); }

    /* Table */
    .table-wrapper { max-width: 1200px; margin: 0 auto 2rem; padding: 0 1rem; }
    .table-container { background: white; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; min-width: 900px; }
    thead { background: var(--primary); color: white; }
    th { padding: 1rem; text-align: center; font-size: 0.8rem; font-weight: 600; }
    td { padding: 1rem; text-align: center; border-bottom: 1px solid #f1f5f9; font-size: 0.9rem; }
    
    /* Interactive Cells */
    .attitude-cell { background: #f0fdf4; color: #166534; cursor: pointer; transition: background 0.2s; font-weight: 500; }
    .attitude-cell:hover { background: #dcfce7; text-decoration: underline; }

    /* Modal Styling */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center; backdrop-filter: blur(4px); }
    .modal-content { background: white; width: 90%; max-width: 500px; border-radius: 16px; padding: 2rem; position: relative; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1); border-top: 5px solid var(--accent); }
    .modal-close { position: absolute; top: 1rem; right: 1rem; background: none; border: none; font-size: 1.5rem; cursor: pointer; color: #94a3b8; }
    .modal-header h3 { color: var(--primary); font-size: 1.25rem; margin-bottom: 0.5rem; }
    .modal-subtitle { font-size: 0.9rem; color: #64748b; display: block; margin-bottom: 1.5rem; }
    .modal-list { list-style: none; }
    .modal-list li { background: #f8fafc; padding: 0.75rem; border-radius: 8px; margin-bottom: 0.5rem; border-left: 3px solid var(--primary); font-size: 0.9rem; }

    /* Filters & Stats (Simplifying for brevity, keeping functionality) */
    .controls { max-width: 1200px; margin: 0 auto 1rem; padding: 0 1rem; display: flex; gap: 1rem; }
    .filter-select { padding: 0.5rem; border-radius: 6px; border: 1px solid #cbd5e1; }
  </style>
</head>
<body>

  <div class="bg-pattern"></div>

  <div class="nav-bar">
    <a href="../../index.html" class="back-btn">
      <i class="fas fa-arrow-left"></i> Back to Dashboard
    </a>
  </div>

  <div class="page-header">
    <h1>Personal Attitude Scores</h1>
    <p>Behavioral & Spiritual Analysis</p>
  </div>

  <div class="controls">
    <select id="filterClass" class="filter-select">
      <option value="">All Classes</option>
    </select>
    <button id="resetFilters" class="back-btn" style="background:var(--primary); color:white;">Reset</button>
  </div>

  <div class="table-wrapper">
    <div class="table-container">
      <table id="nilaiTable">
        <thead>
          <tr>
            <th>Student ID</th>
            <th>Name</th>
            <th>Class</th>
            <th>Life Attitude (A)</th>
            <th>Spiritual (B)</th>
            <th>Social (C)</th>
            <th>Notes</th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <tr><td colspan="7" style="text-align:center; padding:2rem;">Loading...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Modal -->
  <div class="modal" id="attitudeModal">
    <div class="modal-content">
      <button class="modal-close" id="modalClose">&times;</button>
      <div class="modal-header">
        <h3 id="modalTitle">Attitude Details</h3>
        <span class="modal-subtitle" id="modalSubtitle">Student Name</span>
      </div>
      <ul class="modal-list" id="modalList">
        <!-- JS populates this -->
      </ul>
    </div>
  </div>

  <!-- Logic Preserved -->
  <script>
    const SHEET_URL = "https://docs.google.com/spreadsheets/d/1N-docAeezSqzkQcTk8mcPm-qMf-EisMELs_N35zAaT8/gviz/tq?tqx=out:csv&sheet=%F0%9F%98%8A%20personal_attitude";
    const filterClass = document.getElementById("filterClass");
    const resetBtn = document.getElementById("resetFilters");
    const tableBody = document.getElementById("tableBody");
    const attitudeModal = document.getElementById("attitudeModal");
    const modalTitle = document.getElementById("modalTitle");
    const modalSubtitle = document.getElementById("modalSubtitle");
    const modalList = document.getElementById("modalList");
    const modalClose = document.getElementById("modalClose");
    let allData = [];

    function parseCSV(csvText) {
      const rows = []; let currentRow = []; let inQuotes = false; let currentValue = "";
      for (let i=0;i<csvText.length;i++){
        const char=csvText[i];
        if(char==='"'){inQuotes=!inQuotes}
        else if(char===',' && !inQuotes){currentRow.push(currentValue.trim()); currentValue=""}
        else if(char=== '\n' && !inQuotes){currentRow.push(currentValue.trim()); rows.push(currentRow); currentRow=[]; currentValue=""}
        else{currentValue+=char}
      }
      if(currentValue.trim()!==""){currentRow.push(currentValue.trim()); rows.push(currentRow)}
      return rows;
    }

    const attitudeMaps = {
      kehidupan:{'1':'Kebersihan/Kerapian','2':'Ketekunan/Ketelitian','3':'Tanggung Jawab Lingkungan','4':'Berpikir Kritis','5':'Toleransi','6':'Leadership','7':'Keberanian','8':'Nasionalisme','9':'Kreativitas/Inovasi'},
      spiritual:{'1':'Bersyukur','2':'Sholat Berjama\'ah','3':'Berdoa Memulai Kegiatan','4':'Mengucapkan Salam','5':'Suka Membaca Al-Qur\'an'},
      sosial:{'1':'Jujur','2':'Disiplin','3':'Empati/Kasih Sayang','4':'Tanggung Jawab','5':'Kerja Sama','6':'Rasa Hormat'}
    };

    function formatAttitude(numbers){
      if(!numbers || numbers.trim()==='-' || numbers.trim()==='') return '-';
      const nums=numbers.split(',').map(n=>n.trim()).filter(n=>n);
      return nums.length>0 ? nums.join(', ') : '-';
    }

    function showModal(numbers,type,studentName,className){
      if(!numbers || numbers.trim()==='-' || numbers.trim()===''){
        modalList.innerHTML='<li>No data recorded.</li>';
      }else{
        const nums=numbers.split(',').map(n=>n.trim()).filter(n=>n);
        const labels=nums.map(n=>attitudeMaps[type][n]||n).filter(Boolean);
        modalList.innerHTML=labels.length?labels.map(l=>`<li>${l}</li>`).join(''):'<li>No data.</li>';
      }
      modalTitle.textContent=`${type.charAt(0).toUpperCase()+type.slice(1)} Attitude`;
      modalSubtitle.textContent=`${studentName} (${className})`;
      attitudeModal.style.display='flex';
    }

    async function loadData(){
      try{
        const response=await fetch(SHEET_URL);
        const csvText=await response.text();
        const rows=parseCSV(csvText);
        
        allData = rows.slice(1).filter(r=>r.length>=8 && r[1]).map(row=>({
            studentCode:row[1].replace(/"/g,""),
            studentName:row[2].replace(/"/g,""),
            class:row[3].replace(/"/g,""),
            sikapKehidupan:row[4].replace(/"/g,""),
            sikapSpiritual:row[5].replace(/"/g,""),
            sikapSosial:row[6].replace(/"/g,""),
            keterangan:row[7]?row[7].replace(/"/g,""):"-"
        }));

        renderTable(allData);
        fillDropdowns(allData);
      }catch(e){
        console.error("Error:", e);
        tableBody.innerHTML=`<tr><td colspan="7" style="color:red;">Error loading data.</td></tr>`;
      }
    }

    function renderTable(data){
      tableBody.innerHTML="";
      data.forEach(item=>{
        const tr=document.createElement("tr");
        tr.innerHTML=`
          <td style="color:#64748b; font-family:monospace;">${item.studentCode}</td>
          <td style="font-weight:500;">${item.studentName}</td>
          <td><span style="background:#e2e8f0; padding:2px 8px; border-radius:4px; font-size:0.8rem; font-weight:600;">${item.class}</span></td>
          <td class="attitude-cell" onclick="showModal('${item.sikapKehidupan}','kehidupan','${item.studentName}','${item.class}')">${formatAttitude(item.sikapKehidupan)}</td>
          <td class="attitude-cell" onclick="showModal('${item.sikapSpiritual}','spiritual','${item.studentName}','${item.class}')">${formatAttitude(item.sikapSpiritual)}</td>
          <td class="attitude-cell" onclick="showModal('${item.sikapSosial}','sosial','${item.studentName}','${item.class}')">${formatAttitude(item.sikapSosial)}</td>
          <td>${item.keterangan}</td>
        `;
        tableBody.appendChild(tr);
      });
    }

    function fillDropdowns(data){
      const classSet=new Set(data.map(item=>item.class).filter(Boolean));
      filterClass.innerHTML='<option value="">All Classes</option>';
      Array.from(classSet).sort().forEach(item=>{
        const option=document.createElement("option");
        option.value=item; option.textContent=item;
        filterClass.appendChild(option);
      });
    }

    filterClass.addEventListener("change", ()=>{
        const val = filterClass.value.toLowerCase();
        const filtered = val ? allData.filter(i=>i.class.toLowerCase()===val) : allData;
        renderTable(filtered);
    });

    resetBtn.addEventListener("click", ()=>{ filterClass.value=""; renderTable(allData); });
    modalClose.addEventListener("click", ()=>{attitudeModal.style.display='none'});
    window.addEventListener("click",(e)=>{ if(e.target===attitudeModal){attitudeModal.style.display='none'} });

    loadData();
  </script>
</body>
</html>
